<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validasi Form Stok & Harga Barang</title>
    <!-- Menggunakan Bootstrap 5 untuk styling dasar form -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow p-4">
                    <h3 class="mb-4 text-center">Form Input Barang</h3>

                    <!-- Form Utama -->
                    <form id="form-barang" novalidate>

                        <!-- Input Nama Barang -->
                        <div class="mb-3">
                            <label for="nama-barang" class="form-label">Nama Barang</label>
                            <input type="text" class="form-control" id="nama-barang" placeholder="Minimal 5 karakter">
                            <div id="error-nama" class="invalid-feedback"></div>
                        </div>

                        <!-- Input Harga Barang -->
                        <div class="mb-3">
                            <label for="harga-barang" class="form-label">Harga Barang (Rp)</label>
                            <input type="text" class="form-control" id="harga-barang" placeholder="Minimal 1000">
                            <div id="error-harga" class="invalid-feedback"></div>
                        </div>

                        <!-- Input Stok Barang (Sesuai Materi Praktik) -->
                        <div class="mb-3">
                            <label for="stok" class="form-label">Jumlah Stok</label>
                            <input type="text" class="form-control" id="stok" placeholder="Masukkan angka bulat">
                            <div id="error-stok" class="invalid-feedback"></div>
                        </div>

                        <!-- Tombol Submit -->
                        <button type="submit" class="btn btn-primary w-100">Simpan Data</button>
                    </form>

                    <!-- Alert Sukses -->
                    <div id="alert-sukses" class="alert alert-success mt-3 d-none" role="alert">
                        Data berhasil divalidasi dan disimpan!
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Memanggil File JavaScript Eksternal -->
    <script src="app.js"></script>
</body>

</html>
